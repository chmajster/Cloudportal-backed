server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location = /update-status {
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/cloudportal-updater/updater.sock:/status$is_args$args;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }
    location ~ ^/api/v1/(?:appliances/ova-blueprints|instance-backups/upload)$ {
        limit_except POST { deny all; }
        client_max_body_size 100g;
        client_body_timeout 7200s;
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 5s;
    }
    location ~ ^/api/v1/console-sessions/[A-Za-z0-9_-]+/websocket$ {
        proxy_pass http://api:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
