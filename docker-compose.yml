x-backend: &backend
  build:
    context: .
    args:
      BUILD_COMMIT: ${CP_BUILD_COMMIT:-unknown}
  environment: &environment
    CP_DATABASE_URL: postgresql+psycopg://cloudportal:${CP_POSTGRES_PASSWORD:?Set CP_POSTGRES_PASSWORD in .env}@postgres/cloudportal
    CP_REDIS_URL: redis://redis:6379/0
    CP_MASTER_KEY_FILE: /etc/cloudportal-backed/master.key
    CP_DATA_DIR: /var/lib/cloudportal-backed
  volumes:
    - backend-config:/etc/cloudportal-backed
    - backend-data:/var/lib/cloudportal-backed
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp:mode=1777']
  networks: [backend]
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudportal
      POSTGRES_USER: cloudportal
      POSTGRES_PASSWORD: ${CP_POSTGRES_PASSWORD:?Set CP_POSTGRES_PASSWORD in .env}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cloudportal -d cloudportal']
      interval: 5s
      retries: 20
    networks: [backend]
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
    networks: [backend]
  migrate:
    <<: *backend
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  bootstrap:
    <<: *backend
    profiles: [setup]
    command: ['python', '-m', 'app.bootstrap']
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    <<: *backend
    command: ['python', '-m', 'app.jobs.queue']
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  dispatcher:
    <<: *backend
    command: ['python', '-m', 'app.jobs.queue', '--dispatcher']
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  proxy:
    image: nginx:1.28-alpine
    ports: ['${CP_HTTPS_PORT:-8443}:8443']
    volumes:
      - ./scripts/nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on: [api]
    networks: [backend]
    security_opt: ['no-new-privileges:true']
volumes:
  backend-config:
  backend-data:
  postgres-data:
  redis-data:
networks:
  backend:
