name: Backend CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudportal
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cloudportal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cloudportal -d cloudportal_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cloudportal:test-password@localhost:5432/cloudportal_test
      TEST_REDIS_URL: redis://localhost:6379/15
      PORTAL_PATH: ${{ github.workspace }}/.integration/portal
      PHP_BINARY: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chmajster/HomeLAB-Proxmox-CloudPortal
          ref: 4bd1d74d5436bbebdeaadfa8af678139d52100bb
          path: .integration/portal
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql, sodium
          coverage: none
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app migrations scripts
      - name: Check modular boundaries
        run: python scripts/check-module-boundaries.py
      - name: Check all browser JavaScript
        run: find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: bash -n install.sh scripts/install.sh
      - run: scripts/test-installer-platforms.sh
      - run: pytest -q --tb=short
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.13.5'}
      - run: terraform fmt -check -recursive terraform
      - run: bash scripts/validate-terraform-templates.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_COMMIT="$GITHUB_SHA" -t cloudportal-backed:ci .
      - name: Validate Docker Compose contract
        env:
          CP_POSTGRES_PASSWORD: ci-compose-password
          CP_BUILD_COMMIT: ${{ github.sha }}
          CP_HTTPS_PORT: '18443'
        run: docker compose config >/dev/null
  docker-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Docker installation, status and purge
        env:
          REPOSITORY_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file=$(mktemp)
          listener_pid=''
          cleanup() {
            if [[ -n "$listener_pid" ]]; then
              kill "$listener_pid" >/dev/null 2>&1 || true
              wait "$listener_pid" 2>/dev/null || true
            fi
            sudo ./install.sh --docker --uninstall --purge-data >/dev/null 2>&1 || true
            sudo rm -f "$token_file" \
              /tmp/cloudportal-docker-install-output /tmp/cloudportal-docker-status \
              /tmp/cloudportal-docker-port-conflict /tmp/cloudportal-docker-reinstall-output \
              /tmp/cloudportal-docker-invalid-tls-output \
              /tmp/cloudportal-replacement.crt /tmp/cloudportal-replacement.key \
              /tmp/cloudportal-invalid.crt /tmp/cloudportal-invalid.key
          }
          trap cleanup EXIT
          printf '%s' "$REPOSITORY_READ_TOKEN" > "$token_file"
          unset REPOSITORY_READ_TOKEN

          python3 -m http.server 18444 >/dev/null 2>&1 &
          listener_pid=$!
          sleep 1
          if sudo ./install.sh --docker --non-interactive \
            --host localhost \
            --port 18444 \
            --workers 1 \
            --ref "$GITHUB_SHA" \
            --github-token-file "$token_file" \
            > /tmp/cloudportal-docker-port-conflict 2>&1; then
            echo 'Docker installer accepted an occupied HTTPS port.' >&2
            exit 1
          fi
          grep -Fq 'Port HTTPS 18444 jest zajęty' /tmp/cloudportal-docker-port-conflict
          kill "$listener_pid"
          wait "$listener_pid" 2>/dev/null || true
          listener_pid=''

          sudo ./install.sh --docker --non-interactive \
            --host localhost \
            --port 18443 \
            --workers 2 \
            --ref "$GITHUB_SHA" \
            --github-token-file "$token_file" \
            > /tmp/cloudportal-docker-install-output 2>&1

          sudo test -L /opt/cloudportal-backed-docker/current
          sudo test -s /opt/cloudportal-backed-docker/.env
          sudo test "$(sudo stat -c %a /opt/cloudportal-backed-docker/.env)" = 600
          sudo ./install.sh --docker --status > /tmp/cloudportal-docker-status
          grep -Fq 'Docker status' /tmp/cloudportal-docker-status

          sudo curl -fsS --noproxy '*' \
            --cacert /opt/cloudportal-backed-docker/tls/server.crt \
            --resolve localhost:18443:127.0.0.1 \
            https://localhost:18443/api/v1/health >/dev/null

          running_workers=$(sudo docker ps --filter 'label=com.docker.compose.project=cloudportal-backed' --filter 'label=com.docker.compose.service=worker' --format '{{.ID}}' | wc -l)
          test "$running_workers" -eq 2

          tls_before=$(sudo sha256sum /opt/cloudportal-backed-docker/tls/server.crt | awk '{print $1}')
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/cloudportal-replacement.key \
            -out /tmp/cloudportal-replacement.crt \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost' >/dev/null 2>&1

          sudo ./install.sh --docker --non-interactive \
            --host localhost \
            --port 18443 \
            --workers 2 \
            --ref "$GITHUB_SHA" \
            --github-token-file "$token_file" \
            --cert-file /tmp/cloudportal-replacement.crt \
            --cert-key /tmp/cloudportal-replacement.key \
            > /tmp/cloudportal-docker-reinstall-output 2>&1

          tls_after=$(sudo sha256sum /opt/cloudportal-backed-docker/tls/server.crt | awk '{print $1}')
          test "$tls_before" != "$tls_after"
          sudo curl -fsS --noproxy '*' \
            --cacert /opt/cloudportal-backed-docker/tls/server.crt \
            --resolve localhost:18443:127.0.0.1 \
            https://localhost:18443/api/v1/health >/dev/null

          printf '%s\n' 'not-a-certificate' > /tmp/cloudportal-invalid.crt
          printf '%s\n' 'not-a-private-key' > /tmp/cloudportal-invalid.key
          tls_valid=$(sudo sha256sum /opt/cloudportal-backed-docker/tls/server.crt | awk '{print $1}')
          if sudo ./install.sh --docker --non-interactive \
            --host localhost \
            --port 18443 \
            --workers 2 \
            --ref "$GITHUB_SHA" \
            --github-token-file "$token_file" \
            --cert-file /tmp/cloudportal-invalid.crt \
            --cert-key /tmp/cloudportal-invalid.key \
            > /tmp/cloudportal-docker-invalid-tls-output 2>&1; then
            echo 'Docker installer accepted invalid TLS material.' >&2
            exit 1
          fi
          test "$(sudo sha256sum /opt/cloudportal-backed-docker/tls/server.crt | awk '{print $1}')" = "$tls_valid"
          sudo curl -fsS --noproxy '*' \
            --cacert /opt/cloudportal-backed-docker/tls/server.crt \
            --resolve localhost:18443:127.0.0.1 \
            https://localhost:18443/api/v1/health >/dev/null

          sudo ./install.sh --docker --uninstall --purge-data
          test ! -e /opt/cloudportal-backed-docker
      - name: Sanitized Docker diagnostics
        if: failure()
        run: |
          if sudo test -f /tmp/cloudportal-docker-install-output; then
            sudo sed -E \
              -e 's/(Initial (API Token|password):).*/\1 [REDACTED]/I' \
              -e 's/(Authorization: (Bearer|token) )[A-Za-z0-9_.-]+/\1[REDACTED]/Ig' \
              /tmp/cloudportal-docker-install-output | tail -n 160
          fi
          sudo docker ps -a || true

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Native installation and idempotent reinstall
        env:
          REPOSITORY_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file=$(mktemp)
          trap 'sudo rm -f "$token_file" /tmp/cloudportal-install-fixture.json /tmp/master-key-before' EXIT
          printf '%s' "$REPOSITORY_READ_TOKEN" > "$token_file"
          unset REPOSITORY_READ_TOKEN
          sudo ./install.sh --non-interactive --host localhost --enable-backups --backup-retention-days 2 --ref "$GITHUB_SHA" --github-token-file "$token_file" > /tmp/cloudportal-install-output 2>&1
          sudo python3 scripts/installer-smoke.py
          sudo --preserve-env=GITHUB_SHA python3 scripts/update-preflight-smoke.py
          sudo systemctl start cloudportal-backup.service
          sudo test -s "$(sudo find /var/backups/cloudportal-backed -mindepth 2 -maxdepth 2 -name database.dump -type f | head -n 1)"
          sudo systemctl is-enabled --quiet cloudportal-backup.timer
          sudo sha256sum /etc/cloudportal-backed/master.key > /tmp/master-key-before
          tls_before=$(sudo sha256sum /etc/cloudportal-backed/tls/server.crt | awk '{print $1}')
          sudo ./install.sh --non-interactive --host 127.0.0.1 --enable-backups --backup-retention-days 2 --ref "$GITHUB_SHA" --github-token-file "$token_file" > /tmp/cloudportal-reinstall-output 2>&1
          ! sudo grep -q 'Initial API Token:' /tmp/cloudportal-reinstall-output
          sudo sha256sum -c /tmp/master-key-before
          tls_after=$(sudo sha256sum /etc/cloudportal-backed/tls/server.crt | awk '{print $1}')
          test "$tls_before" != "$tls_after"
          sudo openssl x509 -in /etc/cloudportal-backed/tls/server.crt -noout -checkip 127.0.0.1
          sudo python3 scripts/installer-smoke.py --verify-only
      - name: Sanitized service diagnostics
        if: failure()
        run: |
          for output in /tmp/cloudportal-install-output /tmp/cloudportal-reinstall-output; do
            if sudo test -f "$output"; then
              echo "Installer diagnostics: $output"
              sudo sed -E \
                -e 's/(Initial (API Token|password):).*/\1 [REDACTED]/I' \
                -e 's/(Authorization: (Bearer|token) )[A-Za-z0-9_.-]+/\1[REDACTED]/Ig' \
                "$output" | tail -n 120
            fi
          done
          sudo systemctl --no-pager status cloudportal-api cloudportal-dispatcher cloudportal-worker@1 || true
          sudo journalctl --no-pager -u cloudportal-api -u cloudportal-worker@1 -n 50 || true
          echo 'TLS diagnostics:'
          sudo cat /etc/cloudportal-backed/public.conf 2>/dev/null || true
          sudo cat /etc/cloudportal-backed/tls/certificate-source 2>/dev/null || true
          sudo openssl x509 -in /etc/cloudportal-backed/tls/server.crt -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || true
      - name: Remove installer diagnostics
        if: always()
        run: sudo rm -f /tmp/cloudportal-install-output /tmp/cloudportal-reinstall-output
