name: Backend CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudportal
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cloudportal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cloudportal -d cloudportal_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cloudportal:test-password@localhost:5432/cloudportal_test
      TEST_REDIS_URL: redis://localhost:6379/15
      PORTAL_PATH: ${{ github.workspace }}/.integration/portal
      PHP_BINARY: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chmajster/HomeLAB-Proxmox-CloudPortal
          ref: 4bd1d74d5436bbebdeaadfa8af678139d52100bb
          path: .integration/portal
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql, sodium
          coverage: none
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app migrations scripts
      - name: Check modular boundaries
        run: python scripts/check-module-boundaries.py
      - name: Check all browser JavaScript
        run: find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: bash -n install.sh scripts/install.sh
      - run: scripts/test-installer-platforms.sh
      - run: pytest -q --tb=short
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.13.5'}
      - run: terraform fmt -check -recursive terraform
      - run: bash scripts/validate-terraform-templates.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_COMMIT="$GITHUB_SHA" -t cloudportal-backed:ci .
  docker-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Docker installation, status and uninstall
        env:
          REPOSITORY_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file=$(mktemp)
          trap 'sudo rm -f "$token_file"' EXIT
          printf '%s' "$REPOSITORY_READ_TOKEN" > "$token_file"
          unset REPOSITORY_READ_TOKEN

          sudo docker run -d --name cloudportal-port-conflict -p 9443:80 nginx:1.28-alpine >/dev/null
          if sudo ./install.sh --docker --non-interactive --host localhost --port 9443 --workers 2 --ref "$GITHUB_SHA" --github-token-file "$token_file" > /tmp/cloudportal-docker-port-conflict-output 2>&1; then
            echo 'Docker installer accepted a port owned by an unrelated container.' >&2
            exit 1
          fi
          grep -Fq 'spoza projektu cloudportal-backed' /tmp/cloudportal-docker-port-conflict-output
          sudo test ! -e /opt/cloudportal-backed-docker
          sudo test ! -e /etc/cloudportal-backed-docker
          sudo docker rm -f cloudportal-port-conflict >/dev/null

          sudo sh -c 'exec 9>/run/cloudportal-install.lock; flock -n 9; sleep 15' &
          lock_pid=$!
          sleep 1
          if sudo ./install.sh --docker --no-takeover --non-interactive --host localhost --port 9443 --workers 2 --ref "$GITHUB_SHA" --github-token-file "$token_file" > /tmp/cloudportal-docker-lock-output 2>&1; then
            echo 'Docker installer ignored an existing install lock.' >&2
            exit 1
          fi
          grep -Fq -- '--no-takeover' /tmp/cloudportal-docker-lock-output
          sudo kill "$lock_pid" >/dev/null 2>&1 || true
          wait "$lock_pid" 2>/dev/null || true

          sudo ./install.sh --docker --non-interactive --host localhost --port 9443 --workers 2 --ref "$GITHUB_SHA" --github-token-file "$token_file" > /tmp/cloudportal-docker-install-output 2>&1
          curl -kfsS https://localhost:9443/api/v1/health >/dev/null
          worker_count=$(sudo docker ps --filter label=com.docker.compose.project=cloudportal-backed --filter label=com.docker.compose.service=worker --format '{{.ID}}' | wc -l)
          test "$worker_count" -eq 2

          sudo ./install.sh --docker --status > /tmp/cloudportal-docker-status-output 2>&1
          grep -Fq 'Runtime Docker:' /tmp/cloudportal-docker-status-output

          sudo ./install.sh --docker --non-interactive --uninstall --yes > /tmp/cloudportal-docker-uninstall-output 2>&1
          sudo test ! -e /opt/cloudportal-backed-docker
          sudo test -d /etc/cloudportal-backed-docker
          sudo docker volume ls -q --filter label=com.docker.compose.project=cloudportal-backed | grep -q .

          if sudo ./install.sh --docker --non-interactive --uninstall --purge-data > /tmp/cloudportal-docker-purge-confirm-output 2>&1; then
            echo 'Docker purge without --yes unexpectedly succeeded.' >&2
            exit 1
          fi
          grep -Fq -- '--yes' /tmp/cloudportal-docker-purge-confirm-output
          sudo test -d /etc/cloudportal-backed-docker
          sudo docker volume ls -q --filter label=com.docker.compose.project=cloudportal-backed | grep -q .

          sudo ./install.sh --docker --non-interactive --uninstall --purge-data --yes > /tmp/cloudportal-docker-purge-output 2>&1
          sudo test ! -e /etc/cloudportal-backed-docker
          ! sudo docker volume ls -q --filter label=com.docker.compose.project=cloudportal-backed | grep -q .
      - name: Sanitized Docker installer diagnostics
        if: failure()
        run: |
          for output in /tmp/cloudportal-docker-port-conflict-output /tmp/cloudportal-docker-lock-output /tmp/cloudportal-docker-install-output /tmp/cloudportal-docker-status-output /tmp/cloudportal-docker-uninstall-output /tmp/cloudportal-docker-purge-confirm-output /tmp/cloudportal-docker-purge-output; do
            if sudo test -f "$output"; then
              echo "Docker installer diagnostics: $output"
              sudo sed -E \
                -e 's/(Initial (API Token|password):).*/\1 [REDACTED]/I' \
                -e 's/(Authorization: (Bearer|token) )[A-Za-z0-9_.-]+/\1[REDACTED]/Ig' \
                "$output" | tail -n 160
            fi
          done
          sudo docker ps -a || true
          sudo docker volume ls || true

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Native installation and idempotent reinstall
        env:
          REPOSITORY_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file=$(mktemp)
          trap 'sudo rm -f "$token_file" /tmp/cloudportal-install-fixture.json /tmp/master-key-before' EXIT
          printf '%s' "$REPOSITORY_READ_TOKEN" > "$token_file"
          unset REPOSITORY_READ_TOKEN
          sudo ./install.sh --non-interactive --host localhost --enable-backups --backup-retention-days 2 --ref "$GITHUB_SHA" --github-token-file "$token_file" > /tmp/cloudportal-install-output 2>&1
          sudo python3 scripts/installer-smoke.py
          sudo --preserve-env=GITHUB_SHA python3 scripts/update-preflight-smoke.py
          sudo systemctl start cloudportal-backup.service
          sudo test -s "$(sudo find /var/backups/cloudportal-backed -mindepth 2 -maxdepth 2 -name database.dump -type f | head -n 1)"
          sudo systemctl is-enabled --quiet cloudportal-backup.timer
          sudo sha256sum /etc/cloudportal-backed/master.key > /tmp/master-key-before
          tls_before=$(sudo sha256sum /etc/cloudportal-backed/tls/server.crt | awk '{print $1}')
          sudo ./install.sh --non-interactive --host 127.0.0.1 --enable-backups --backup-retention-days 2 --ref "$GITHUB_SHA" --github-token-file "$token_file" > /tmp/cloudportal-reinstall-output 2>&1
          ! sudo grep -q 'Initial API Token:' /tmp/cloudportal-reinstall-output
          sudo sha256sum -c /tmp/master-key-before
          tls_after=$(sudo sha256sum /etc/cloudportal-backed/tls/server.crt | awk '{print $1}')
          test "$tls_before" != "$tls_after"
          sudo openssl x509 -in /etc/cloudportal-backed/tls/server.crt -noout -checkip 127.0.0.1
          sudo python3 scripts/installer-smoke.py --verify-only

          sudo ./install.sh --non-interactive --uninstall --yes > /tmp/cloudportal-uninstall-output 2>&1
          sudo test ! -e /opt/cloudportal-backed
          sudo test ! -e /etc/systemd/system/cloudportal-api.service
          sudo test ! -e /etc/nginx/conf.d/cloudportal-backed.conf
          sudo test -d /etc/cloudportal-backed
          sudo test -d /var/lib/cloudportal-backed
          id cloudportal >/dev/null

          sudo ./install.sh --non-interactive --uninstall --purge-data --yes > /tmp/cloudportal-purge-output 2>&1
          sudo test ! -e /etc/cloudportal-backed
          sudo test ! -e /var/lib/cloudportal-backed
          sudo test ! -e /var/backups/cloudportal-backed
          ! id cloudportal >/dev/null 2>&1
          ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='cloudportal'" | grep -qx 1
          ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='cloudportal'" | grep -qx 1
      - name: Sanitized service diagnostics
        if: failure()
        run: |
          for output in /tmp/cloudportal-install-output /tmp/cloudportal-reinstall-output /tmp/cloudportal-uninstall-output /tmp/cloudportal-purge-output; do
            if sudo test -f "$output"; then
              echo "Installer diagnostics: $output"
              sudo sed -E \
                -e 's/(Initial (API Token|password):).*/\1 [REDACTED]/I' \
                -e 's/(Authorization: (Bearer|token) )[A-Za-z0-9_.-]+/\1[REDACTED]/Ig' \
                "$output" | tail -n 120
            fi
          done
          sudo systemctl --no-pager status cloudportal-api cloudportal-dispatcher cloudportal-worker@1 || true
          sudo journalctl --no-pager -u cloudportal-api -u cloudportal-worker@1 -n 50 || true
          echo 'TLS diagnostics:'
          sudo cat /etc/cloudportal-backed/public.conf 2>/dev/null || true
          sudo cat /etc/cloudportal-backed/tls/certificate-source 2>/dev/null || true
          sudo openssl x509 -in /etc/cloudportal-backed/tls/server.crt -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || true
      - name: Remove installer diagnostics
        if: always()
        run: sudo rm -f /tmp/cloudportal-install-output /tmp/cloudportal-reinstall-output /tmp/cloudportal-uninstall-output /tmp/cloudportal-purge-output
