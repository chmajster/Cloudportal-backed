name: Provider Platform Validation

on:
  push:
    branches:
      - feature/provider-platform-defaults
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudportal
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cloudportal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cloudportal -d cloudportal_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cloudportal:test-password@localhost:5432/cloudportal_test
      TEST_REDIS_URL: redis://localhost:6379/15
      PORTAL_PATH: ${{ github.workspace }}/.integration/portal
      PHP_BINARY: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chmajster/HomeLAB-Proxmox-CloudPortal
          ref: feature/provider-platform-defaults
          path: .integration/portal
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql, sodium
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app migrations scripts
      - name: Check browser JavaScript
        run: find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate installer shell
        run: bash -n install.sh scripts/install.sh
      - name: Run full backend test suite
        run: pytest -q --tb=short
