name: Prepare installer cron change
on:
  push:
    branches: [codex/installer-cron-auto-update-12h]
    paths: [.github/workflows/prepare-installer-cron.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/installer-cron-auto-update-12h
      - name: Apply base-checked installer integration
        run: |
          python scripts/_prepare_installer_cron.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_installer_cron_update.py')
          text = path.read_text()
          text = text.replace("    monkeypatch.setattr(client.fcntl, 'flock', 'flock') if False else None\n", '')
          path.write_text(text)
          PY
      - name: Check complete standalone installer
        run: |
          bash -n install.sh scripts/install.sh
          bash install.sh --help | grep -- --enable-auto-update
          bash install.sh --auto-update-status
          bash scripts/test-installer-platforms.sh
      - name: Run isolated cron regression tests
        run: |
          python -m venv "$RUNNER_TEMP/cron-test-venv"
          "$RUNNER_TEMP/cron-test-venv/bin/pip" install pytest
          isolated=$(mktemp -d)
          mkdir -p "$isolated/tests"
          cp install.sh "$isolated/install.sh"
          cp tests/test_installer_cron_update.py "$isolated/tests/"
          (cd "$isolated"; "$RUNNER_TEMP/cron-test-venv/bin/python" -m pytest -q tests/test_installer_cron_update.py)
          rm -rf "$isolated"
      - name: Check repository boundaries and browser syntax
        run: |
          python scripts/check-module-boundaries.py
          find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit only the validated installer and regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh tests/test_installer_cron_update.py
          git commit -m 'feat(installer): add opt-in cron updates every 12 hours'
          git push origin HEAD:codex/installer-cron-auto-update-12h
