name: Integrate Cloud-init PR branches
on:
  push:
    branches: [feat/workflow-cloud-init-first-boot]
    paths: [.github/workflows/integrate-cloud-init-prs.yml]
permissions:
  contents: write
concurrency:
  group: cloud-init-pr-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile pinned PR history and scoped code
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/feat/workflow-cloud-init-first-boot | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source_sha=f5cd4e89029d7987cb507b8f9bbb63463e8bdda3
          git cat-file -e "$source_sha^{commit}"
          if ! git merge --no-commit --no-ff "$source_sha"; then
            python - <<'PY'
          import subprocess
          allowed = {'app/executors/terraform.py', 'app/web/features/blueprint-wizard-cloud-init.js',
                     'app/web/features/blueprint-wizard-core.js', 'app/web/features/blueprint-wizard.js',
                     'terraform/templates/proxmox-vm/main.tf'}
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          if not conflicts or not conflicts <= allowed:
              raise SystemExit('Unexpected integration conflict; branch remains unchanged: ' + repr(conflicts))
          PY
          fi
          git checkout "$source_sha" -- app/executors/terraform.py app/web/features/blueprint-wizard-cloud-init.js app/web/features/blueprint-wizard-core.js app/web/features/blueprint-wizard.js terraform/templates/proxmox-vm/main.tf
          python scripts/integrate_cloud_init_prs.py
          git rm .github/workflows/merge-validation-source.yml scripts/integrate_cloud_init_prs.py
          git add app tests docs
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --quiet HEAD -- install.sh docker-compose.yml .github/workflows/ci.yml tests/test_installer_terminal_ui.py
          git diff --cached --check
          python -m compileall -q app tests
          python scripts/check-module-boundaries.py
          find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git commit -m 'Merge PR #155 into #156, preserve native ISO transport and reconcile workflow contracts'
          git push origin HEAD:refs/heads/feat/workflow-cloud-init-first-boot
          git show -s --format='%H %P'
