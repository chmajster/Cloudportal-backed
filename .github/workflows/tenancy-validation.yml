name: Tenancy validation
on:
  pull_request:
    paths:
      - 'app/tenancy/**'
      - 'app/modules/feature_tenancy.py'
      - 'tests/tenancy/**'
      - 'migrations/versions/*tenancy*'
      - 'docs/roadmap/governance.md'
      - '.github/workflows/tenancy-validation.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudportal
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cloudportal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cloudportal -d cloudportal_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cloudportal:test-password@localhost:5432/cloudportal_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package exact tracked source for reproducible regression investigation
        run: git archive --format=tar.gz -o /tmp/tenancy-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tenancy-source-${{ github.sha }}
          path: /tmp/tenancy-source.tar.gz
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check-module-boundaries.py
      - run: find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: pytest -q --tb=short
