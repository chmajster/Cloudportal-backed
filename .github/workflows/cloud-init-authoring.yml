name: Cloud-init editor integration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/cloud-init-authoring.yml']
permissions:
  contents: read
concurrency:
  group: cloud-init-feature-authoring
  cancel-in-progress: false
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/workflow-cloud-init-first-boot' && github.event.pull_request.number == 156
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workflow-cloud-init-first-boot
      - name: Preserve Cloud-init and expose it in the classic editor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'app/web/features/blueprints.js': '9d9e118c562dcdee8ae94a5a290b3405ea7b4050',
              'app/web/features/blueprint-provisioning-guards.js': '7e798df05938218a0e10bad533f49f64a6df2dab',
          }
          changes = {}
          for name, sha in expected.items():
              raw = Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha, name
              changes[name] = raw.decode()
          name = 'app/web/features/blueprints.js'
          before = 'async function proxmoxBlueprintForm(item = null, options = {}) {\n  try {'
          after = "async function proxmoxBlueprintForm(item = null, options = {}) {\n  // The quick form regenerates the DAG and drops Cloud-init. Preserve native\n  // first-boot declarations and approved-plan dependencies in the full editor.\n  if ((item?.workflow || []).some(step => step.type === 'cloud_init')) return blueprintForm(item);\n  try {"
          assert changes[name].count(before) == 1
          changes[name] = changes[name].replace(before, after)
          before = "    const workflowTypes = [\n      ['terraform_plan'"
          after = "    const workflowTypes = [\n      ['cloud_init', 'Cloud-init: pierwszy start systemu'],\n      ['terraform_plan'"
          assert changes[name].count(before) == 1
          changes[name] = changes[name].replace(before, after)
          name = 'app/web/features/blueprint-provisioning-guards.js'
          before = "const proxmoxOnly = new Set(['wait_for_vm',"
          after = "const proxmoxOnly = new Set(['cloud_init', 'wait_for_vm',"
          assert changes[name].count(before) == 1
          changes[name] = changes[name].replace(before, after)
          for name, content in changes.items():
              Path(name).write_text(content)
          PY
          python scripts/check-module-boundaries.py
          find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check
          git add -- app/web/features/blueprints.js app/web/features/blueprint-provisioning-guards.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(blueprints): preserve Cloud-init when editing an existing workflow'
          git push origin HEAD:refs/heads/feat/workflow-cloud-init-first-boot
