name: Cloud-init branch authoring
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/cloud-init-authoring.yml'
      - 'scripts/_apply_cloud_init_feature_patch.py'
permissions:
  contents: read
concurrency:
  group: cloud-init-feature-authoring
  cancel-in-progress: false
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/workflow-cloud-init-first-boot' && github.event.pull_request.number == 156
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workflow-cloud-init-first-boot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - name: Apply guarded source integration
        run: python scripts/_apply_cloud_init_feature_patch.py
      - run: terraform fmt terraform/templates/proxmox-vm/main.tf
      - run: pip install -r requirements-dev.txt
      - name: Validate source and focused regressions
        run: |
          set -euo pipefail
          python -m compileall -q app tests/test_cloud_init_workflow.py
          python scripts/check-module-boundaries.py
          find app/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m pytest -q --tb=short tests/test_cloud_init_workflow.py tests/test_blueprint_wizard_contract.py
          terraform fmt -check -recursive terraform
          git diff --check
      - name: Commit only reviewed integration paths
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/workflow-cloud-init-first-boot'
          git add -- app/executors/terraform.py app/web/features/blueprint-wizard-core.js app/web/features/blueprint-wizard.js app/api/schemas.py app/api/automation.py terraform/templates/proxmox-vm/main.tf tests/test_blueprint_wizard_contract.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(blueprints): integrate first-boot Cloud-init credentials and QGA'
          git push origin HEAD:refs/heads/feat/workflow-cloud-init-first-boot
