- name: Install platform web server
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install Apache on Debian family
      ansible.builtin.package:
        name: apache2
        state: present
      when: ansible_facts.os_family == 'Debian'
    - name: Start Apache on Debian family
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      when: ansible_facts.os_family == 'Debian'
    - name: Install httpd on RedHat family
      ansible.builtin.package:
        name: httpd
        state: present
      when: ansible_facts.os_family == 'RedHat'
    - name: Start httpd on RedHat family
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      when: ansible_facts.os_family == 'RedHat'
